<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CleanBrain - Saved Snippets</title>
  <link rel="stylesheet" href="style.css">
 

  <script src="popup.js"></script>
  <style>
    body {

        min-width: 400px;
        min-height: 600px;
        background-image: url('brain.png');
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CleanBrain</h1>
    <h2>Работай с текстом и не засоряй голову</h2>
   
    

    <div id="snippets"></div>
    <button id="deleteAll" class="delete-all">Удалить все</button>
  </div>
  <!-- Кнопка шестерёнки (иконка настроек) -->
<img src="settings.png" id="settingsIcon" alt="⚙" title="Настройки"
style="position: absolute; top: 10px; right: 10px; width: 48px; height: 48px; cursor: pointer;">

<!-- Кнопка удаления всех вырезок -->
<button id="deleteAll" class="delete-all fancy-button">Удалить все</button>

<!-- ⚙ Модальное окно с настройками -->
<div id="settingsModal" class="settings-modal" style="display: none;">
  <div class="modalContent">
    <img src="settings.png" alt="Brain" style="display:block; margin: 10px auto; width: 80px;">
    
    <h3>Настройки сохранения</h3>

    <label>
      <input type="checkbox" id="autosaveToggle">
      Вводить название связи вручную
    </label>

    <label for="formatSelect">Формат файла:</label>
    <select id="formatSelect">
      <option value="md">Markdown (.md)</option>
      <option value="txt">Текст (.txt)</option>
      <option value="rdf">RDF (.ttl)</option>
    </select>

    <label for="linkTypeSelect">Тип связи между заметками:</label>
    <select id="linkTypeSelect">
      <option value="double-bracket">[[note]]</option>
      <option value="hashtag">#тег</option>
      <option value="uri">URI</option>
    </select>

    <label for="defaultLinkText">Название связи (если ввод вручную отключён):</label>
    <input type="text" id="defaultLinkText" placeholder="например: машины">

    <div class="button-row">
      <button id="saveSettings" class="primary-button fancy-button">Сохранить</button>
      <button id="closeSettings" class="primary-button fancy-button">Закрыть</button>

    </div>
  </div>
</div>


</body>
</html>
